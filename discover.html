<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel App - Main Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #cbd5e1; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; scrollbar-width: none; }
        ::-webkit-scrollbar { display: none !important; }
        .phone-frame { width: 345px; height: 610px; background: #ffffff; border-radius: 32px; box-shadow: 0 15px 35px rgba(0,0,0,0.25); border: 8px solid #1e293b; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; }
        .tab-content { display: block; padding: 0 15px; flex: 1; overflow-y: auto; padding-bottom: 30px; scrollbar-width: none; }
        .tab-content::-webkit-scrollbar { display: none !important; }
        #feedPostsContainer { display: flex; flex-direction: column; gap: 15px; padding-bottom: 40px; }
        .injected-feed-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .injected-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        .injected-body { padding: 12px; text-align: left; }
        .app-overlay-input-widget { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200000; display: none; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .app-overlay-input-widget.active { display: flex; }
        .widget-box-frame { background: #ffffff; border-radius: 16px; padding: 16px; width: 100%; }
        .widget-input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; margin-bottom: 12px; }
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 55px; background: #ffffff; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-around; align-items: center; z-index: 9999; box-sizing: border-box; }
        .nav-item { background: none; border: none; font-size: 11px; color: #5F84A2; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-decoration: none; font-weight: bold; flex: 1; }
        .nav-item.active { color: #194569; }
        .loading-note { text-align: center; font-size: 12px; color: #888; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div id="explore-screen" class="tab-content" style="padding-top: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div style="font-size: 14px; color: #333; font-weight: 500;">📍 Mumbai, India</div>
                <a href="profile.html" style="width: 35px; height: 35px; background: #A0B2C6; border-radius: 50%; display: block;"></a>
            </div>
            <h1 id="welcomeGreeting" style="color: #194569; font-size: 26px; margin: 0 0 15px 0; font-weight: bold; text-align: left;">Where do you wanna go?</h1>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="destinationSearch" onkeyup="filterDestinations()" placeholder="Search destinations..." style="flex: 1; padding: 12px; border: 1px solid #e2e8f0; background: #f7fafc; border-radius: 12px; outline: none;">
            </div>
            <div id="feedPostsContainer"><p class="loading-note">Loading posts...</p></div>
        </div>

        <div class="app-overlay-input-widget" id="exploreInputWidget">
            <div class="widget-box-frame">
                <p id="exploreWidgetLabel" style="margin:0 0 10px 0; font-weight:bold; color:#194569;">Add Comment:</p>
                <input type="text" id="exploreWidgetField" class="widget-input" placeholder="Type your response...">
                <div style="display:flex; gap:8px;">
                    <button onclick="closeExploreCommentOverlay()" style="flex:1; padding:8px; border:none; background:#e2e8f0; border-radius:6px; cursor:pointer;">Cancel</button>
                    <button onclick="commitExploreCommentOverlay()" style="flex:1; padding:8px; border:none; background:#194569; color:#fff; border-radius:6px; cursor:pointer;">Submit</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="discover.html" class="nav-item active">🏠<br>Explore</a>
            <a href="solo.html" class="nav-item">💬<br>Messages</a>
            <a href="profile.html" class="nav-item">👤<br>Profile</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import {
            getFirestore, collection, addDoc, deleteDoc, doc, updateDoc,
            query, orderBy, getDocs, arrayUnion, arrayRemove, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR API KEY HERE",
            authDomain: "travel-app-9a965.firebaseapp.com",
            projectId: "travel-app-9a965",
            storageBucket: "travel-app-9a965.firebasestorage.app",
            messagingSenderId: "611523199957",
            appId: "1:611523199957:web:0b183bc5f1e8f67182335c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let myUid = null;
        let myUsername = "traveler";
        let cachedPosts = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            myUid = user.uid;
            myUsername = localStorage.getItem('loggedInUsername') || localStorage.getItem('loggedInUser') || "traveler";

            var greetingElement = document.getElementById('welcomeGreeting');
            if (greetingElement) greetingElement.innerHTML = `Where do you wanna go, ${myUsername}?`;

            await loadFeed();
        });

        async function loadFeed() {
            const container = document.getElementById('feedPostsContainer');
            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);

                cachedPosts = [];
                snap.forEach((docSnap) => {
                    cachedPosts.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderFeed();
            } catch (e) {
                container.innerHTML = `<p class="loading-note">Couldn't load posts: ${e.message}</p>`;
            }
        }

        function renderFeed() {
            const container = document.getElementById('feedPostsContainer');
            container.innerHTML = "";

            if (cachedPosts.length === 0) {
                container.innerHTML = `<p class="loading-note">No hidden gems posted yet. Be the first — post one from your Profile!</p>`;
                return;
            }

            cachedPosts.forEach((post) => {
                const comments = post.comments || [];
                const card = document.createElement('div');
                card.className = "injected-feed-card";

                const isMine = post.authorUid === myUid;

                card.innerHTML = `
                    <div class="injected-header">
                        <div>
                            <strong style="font-size:12px; color:#194569;">👤 @${post.authorUsername || 'traveler'}</strong>
                            <span style="font-size:9px; color:#64748b; margin-left:8px;">📍 ${post.location}</span>
                        </div>
                        ${isMine ? `<button onclick="removeTargetPublicPost('${post.id}')" style="background:none; border:none; color:#e63946; font-size:11px; cursor:pointer; font-weight:bold;">🗑️ Delete</button>` : ''}
                    </div>
                    <div style="width:100%; height:150px; overflow:hidden; background:#f1f5f9;">
                        <img src="${post.image}" style="width:100%; height:100%; object-fit:cover;">
                    </div>
                    <div class="injected-body">
                        <div style="font-size:13px; color:#222; margin-bottom:8px;"><strong>@${post.authorUsername || 'traveler'}:</strong> ${post.caption}</div>
                        <div style="font-size:12px; font-weight:bold; color:#194569; margin-bottom:6px; cursor:pointer;" onclick="launchDynamicPostCommentOverlay('${post.id}')">💬 Comment (${comments.length})</div>
                        <div style="background:#f8fafc; border-radius:8px; padding:6px 10px; display:${comments.length > 0 ? 'block' : 'none'}; border:1px solid #e2e8f0;">
                            ${comments.map((c, cIdx) => `
                                <div style="font-size:11px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;">
                                    <span><strong>@${c.user}:</strong> ${c.text}</span>
                                    ${c.user === myUsername ? `<span style="color:#e63946; cursor:pointer; margin-left:auto; font-weight:bold; padding:0 4px;" onclick="deleteDiscoverComment('${post.id}', ${cIdx})">❌</span>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.removeTargetPublicPost = async function (postId) {
            await deleteDoc(doc(db, "posts", postId));
            await loadFeed();
        };

        let currentCommentPostId = null;

        window.launchDynamicPostCommentOverlay = function (postId) {
            currentCommentPostId = postId;
            document.getElementById('exploreWidgetField').value = "";
            document.getElementById('exploreInputWidget').classList.add('active');
        };

        window.closeExploreCommentOverlay = function () {
            document.getElementById('exploreInputWidget').classList.remove('active');
        };

        window.commitExploreCommentOverlay = async function () {
            const val = document.getElementById('exploreWidgetField').value.trim();
            if (val === "" || !currentCommentPostId) return closeExploreCommentOverlay();

            const newComment = { user: myUsername, text: val };
            await updateDoc(doc(db, "posts", currentCommentPostId), {
                comments: arrayUnion(newComment)
            });

            closeExploreCommentOverlay();
            await loadFeed();
        };

        window.deleteDiscoverComment = async function (postId, commentIdx) {
            const post = cachedPosts.find(p => p.id === postId);
            if (!post || !post.comments) return;

            const commentToRemove = post.comments[commentIdx];
            await updateDoc(doc(db, "posts", postId), {
                comments: arrayRemove(commentToRemove)
            });

            await loadFeed();
        };

        window.filterDestinations = function () {
            var input = document.getElementById('destinationSearch').value.toLowerCase();
            document.querySelectorAll('.injected-feed-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(input) ? 'block' : 'none';
            });
        };

        // Expose a way for profile.html's post form to reach Firestore too
        window._discoverDb = { db, collection, addDoc, serverTimestamp };
    </script>
</body>
</html>
