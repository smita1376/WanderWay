<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel App - Create Account</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .phone-frame {
            width: 345px;
            height: 610px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            border: 8px solid #1e293b;
            box-sizing: border-box;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #91AEC4;
            background: #f8fafc;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        .field-hint { font-size: 10px; color: #888; margin: -8px 0 12px 4px; text-align: left; min-height: 12px; }
        .field-hint.error { color: #e63946; }
        .field-hint.success { color: #2a9d8f; }
        .action-btn {
            width: 100%;
            padding: 12px;
            background: #194569;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-msg { font-size: 12px; margin-top: 10px; min-height: 16px; }
        .status-msg.error { color: #e63946; }
        .status-msg.success { color: #2a9d8f; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <h2 style="color: #194569; margin-bottom: 5px;">Join the Hub 🗺️</h2>
        <p style="color: #666; font-size: 13px; margin-top: 0; margin-bottom: 20px;">Create your profile credentials</p>

        <input type="text" id="signupUsernameInput" class="input-field" placeholder="Choose a username (e.g. joe_travels)">
        <p class="field-hint" id="usernameHint">Letters, numbers, underscores only. 3-20 characters.</p>

        <input type="email" id="signupEmailInput" class="input-field" placeholder="Enter Email Address">
        <input type="password" id="signupPasswordInput" class="input-field" placeholder="Create Password (min 6 characters)">

        <button type="button" id="signupBtn" class="action-btn">Sign Up</button>
        <p class="status-msg" id="statusMsg"></p>

        <p style="font-size: 13px; color: #555; margin-top: 12px;">
            Already have an account? <a href="login.html" style="color: #194569; font-weight: bold; text-decoration: none;">Log In</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCs0OGS4sSH8cnKCFEcHULC2Dj7Fp1tQIY",
            authDomain: "travel-app-9a965.firebaseapp.com",
            projectId: "travel-app-9a965",
            storageBucket: "travel-app-9a965.firebasestorage.app",
            messagingSenderId: "611523199957",
            appId: "1:611523199957:web:0b183bc5f1e8f67182335c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const usernameInput = document.getElementById('signupUsernameInput');
        const usernameHint = document.getElementById('usernameHint');
        const emailInput = document.getElementById('signupEmailInput');
        const passInput = document.getElementById('signupPasswordInput');
        const signupBtn = document.getElementById('signupBtn');
        const statusMsg = document.getElementById('statusMsg');

        const USERNAME_PATTERN = /^[a-zA-Z0-9_]{3,20}$/;

        usernameInput.addEventListener('input', function () {
            const val = usernameInput.value.trim();
            if (val === "") {
                usernameHint.textContent = "Letters, numbers, underscores only. 3-20 characters.";
                usernameHint.className = "field-hint";
            } else if (!USERNAME_PATTERN.test(val)) {
                usernameHint.textContent = "Only letters, numbers, underscores. 3-20 characters.";
                usernameHint.className = "field-hint error";
            } else {
                usernameHint.textContent = "Looks good — we'll confirm it's available on submit.";
                usernameHint.className = "field-hint success";
            }
        });

        signupBtn.addEventListener('click', async function () {
            const usernameRaw = usernameInput.value.trim();
            const usernameLower = usernameRaw.toLowerCase();
            const emailVal = emailInput.value.toLowerCase().trim();
            const passVal = passInput.value.trim();

            statusMsg.textContent = "";
            statusMsg.className = "status-msg";

            if (usernameRaw === "" || emailVal === "" || passVal === "") {
                statusMsg.textContent = "Please fill out all fields completely.";
                statusMsg.className = "status-msg error";
                return;
            }

            if (!USERNAME_PATTERN.test(usernameRaw)) {
                statusMsg.textContent = "Username must be 3-20 characters: letters, numbers, underscores only.";
                statusMsg.className = "status-msg error";
                return;
            }

            signupBtn.disabled = true;
            signupBtn.textContent = "Checking username...";

            try {
                const usernameDocRef = doc(db, "usernames", usernameLower);
                const usernameSnap = await getDoc(usernameDocRef);

                if (usernameSnap.exists()) {
                    statusMsg.textContent = "That username is already taken. Try another.";
                    statusMsg.className = "status-msg error";
                    signupBtn.disabled = false;
                    signupBtn.textContent = "Sign Up";
                    return;
                }

                signupBtn.textContent = "Creating account...";

                const userCredential = await createUserWithEmailAndPassword(auth, emailVal, passVal);
                const user = userCredential.user;

                // Username now doubles as the display name shown across the app
                await updateProfile(user, { displayName: usernameRaw });

                await setDoc(doc(db, "users", user.uid), {
                    username: usernameLower,
                    email: emailVal,
                    createdAt: serverTimestamp()
                });

                await setDoc(usernameDocRef, {
                    uid: user.uid
                });

                localStorage.setItem('loggedInUser', usernameRaw);
                localStorage.setItem('loggedInUsername', usernameLower);

                statusMsg.textContent = "Account created! Redirecting...";
                statusMsg.className = "status-msg success";

                setTimeout(() => {
                    window.location.href = "discover.html";
                }, 900);

            } catch (error) {
                signupBtn.disabled = false;
                signupBtn.textContent = "Sign Up";
                statusMsg.className = "status-msg error";

                if (error.code === "auth/email-already-in-use") {
                    statusMsg.textContent = "An account with this email already exists.";
                } else if (error.code === "auth/weak-password") {
                    statusMsg.textContent = "Password should be at least 6 characters.";
                } else if (error.code === "auth/invalid-email") {
                    statusMsg.textContent = "Please enter a valid email address.";
                } else {
                    statusMsg.textContent = "Something went wrong: " + error.message;
                }
            }
        });
    </script>

</body>
</html>
