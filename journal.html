<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel App - Journal</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #cbd5e1; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
        .phone-frame { width: 345px; height: 610px; background: #ffffff; border-radius: 32px; box-shadow: 0 15px 35px rgba(0,0,0,0.25); border: 8px solid #1e293b; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; transform: scale(0.85); transform-origin: center center; }
        .top-header { display: flex; align-items: center; padding: 12px 15px; background: #ffffff; border-bottom: 1px solid #f0f4f8; }
        .back-link { text-decoration: none; font-size: 13px; color: #194569; font-weight: bold; padding-right: 15px; }

        .journal-content { flex: 1; overflow-y: auto; padding: 15px; box-sizing: border-box; scrollbar-width: none; }

        .new-entry-box { background: #f8fafc; border: 1px dashed #91AEC4; border-radius: 14px; padding: 12px; margin-bottom: 16px; }
        .journal-textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 12px; font-family: inherit; box-sizing: border-box; resize: none; }

        .share-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .share-label { font-size: 11px; color: #666; }
        .toggle-switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: 0.2s; border-radius: 22px; }
        .toggle-slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: 0.2s; border-radius: 50%; }
        .toggle-switch input:checked + .toggle-slider { background-color: #194569; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); }

        .save-entry-btn { width: 100%; padding: 8px; background: #194569; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        .entry-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; text-align: left; }
        .entry-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .entry-date { font-size: 10px; color: #5F84A2; font-weight: bold; }
        .entry-badge { font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
        .entry-badge.private { background: #f1f5f9; color: #666; }
        .entry-badge.shared { background: #e0f0e8; color: #2a9d8f; }
        .entry-text { font-size: 12px; color: #222; line-height: 1.4; white-space: pre-wrap; }
        .entry-delete { background: none; border: none; color: #e63946; font-size: 11px; cursor: pointer; margin-top: 6px; font-weight: bold; }
        .no-entries { font-size: 11px; color: #888; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="top-header">
            <a href="profile.html" class="back-link">← Profile</a>
            <h3 style="margin: 0; color: #194569; font-size: 14px; font-weight: bold;">Journal</h3>
        </div>

        <div class="journal-content">
            <div class="new-entry-box">
                <textarea id="journalTextInput" class="journal-textarea" rows="3" placeholder="What's on your mind today?"></textarea>
                <div class="share-toggle-row">
                    <span class="share-label" id="shareLabel">🔒 Private — only you can see this</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="shareToggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <button type="button" class="save-entry-btn" onclick="addJournalEntry()">Save Entry</button>
            </div>

            <div id="journalEntriesList"></div>
        </div>
    </div>

    <script>
        function loadJournalEntries() {
            return JSON.parse(localStorage.getItem('myJournalEntries')) || [];
        }

        function saveJournalEntries(entries) {
            localStorage.setItem('myJournalEntries', JSON.stringify(entries));
        }

        document.getElementById('shareToggle').addEventListener('change', function() {
            var label = document.getElementById('shareLabel');
            label.textContent = this.checked
                ? "🌍 Shared — visible to others (coming soon)"
                : "🔒 Private — only you can see this";
        });

        function addJournalEntry() {
            var textInput = document.getElementById('journalTextInput');
            var text = textInput.value.trim();
            var isShared = document.getElementById('shareToggle').checked;

            if (text === "") {
                alert("Write something before saving!");
                return;
            }

            var entries = loadJournalEntries();
            entries.unshift({
                id: "journal_" + Date.now(),
                text: text,
                shared: isShared,
                createdAt: new Date().toISOString()
            });
            saveJournalEntries(entries);

            textInput.value = "";
            document.getElementById('shareToggle').checked = false;
            document.getElementById('shareLabel').textContent = "🔒 Private — only you can see this";

            renderJournalEntries();
        }

        function deleteJournalEntry(id) {
            var entries = loadJournalEntries().filter(function(e) { return e.id !== id; });
            saveJournalEntries(entries);
            renderJournalEntries();
        }

        function renderJournalEntries() {
            var container = document.getElementById('journalEntriesList');
            var entries = loadJournalEntries();
            container.innerHTML = "";

            if (entries.length === 0) {
                container.innerHTML = '<p class="no-entries">No journal entries yet. Write your first thought above!</p>';
                return;
            }

            entries.forEach(function(entry) {
                var dateReadable = new Date(entry.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                var card = document.createElement('div');
                card.className = "entry-card";
                card.innerHTML = `
                    <div class="entry-meta-row">
                        <span class="entry-date">${dateReadable}</span>
                        <span class="entry-badge ${entry.shared ? 'shared' : 'private'}">${entry.shared ? '🌍 Shared' : '🔒 Private'}</span>
                    </div>
                    <div class="entry-text">${entry.text}</div>
                    <button class="entry-delete" onclick="deleteJournalEntry('${entry.id}')">🗑️ Delete</button>
                `;
                container.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', renderJournalEntries);
    </script>
</body>
</html>
