<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel App - Settings & Planner</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #cbd5e1; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
        .phone-frame { width: 345px; height: 610px; background: #ffffff; border-radius: 32px; border: 8px solid #1e293b; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; transform: scale(0.85); transform-origin: center center; }
        .top-header { display: flex; align-items: center; padding: 12px 15px; background: #ffffff; border-bottom: 1px solid #f0f4f8; }
        .settings-content { flex: 1; overflow-y: auto; padding: 15px; box-sizing: border-box; scrollbar-width: none; }
        .settings-group { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 5px; margin-bottom: 15px; }
        .form-input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 11px; box-sizing: border-box; }
        .logout-btn { width: 100%; padding: 12px; background: #e63946; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 5px; }
        .section-label { font-size: 11px; color: #666; font-weight: bold; text-transform: uppercase; margin: 5px 0 8px 5px; text-align: left; }

        .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px; }
        .toggle-switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: 0.2s; border-radius: 24px; }
        .toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: 0.2s; border-radius: 50%; }
        .toggle-switch input:checked + .toggle-slider { background-color: #194569; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

        .visibility-status { font-size: 10px; color: #666; margin-top: 4px; text-align: left; }
        .save-city-btn { width: 100%; padding: 8px; background: #194569; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .save-city-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="top-header">
            <a href="profile.html" style="text-decoration: none; font-size: 13px; color: #194569; font-weight: bold; padding-right: 15px;">← Profile</a>
            <h3 style="margin: 0; color: #194569; font-size: 14px; font-weight: bold;">Settings</h3>
        </div>

        <div class="settings-content">

            <p class="section-label">Solo Travel Visibility</p>
            <div class="settings-group" style="padding: 12px; background: #f0f7fc; border: 1px solid #91AEC4;">
                <div class="toggle-row">
                    <div>
                        <strong style="font-size:12px; color:#194569;">Visible to other travelers</strong>
                        <p class="visibility-status" id="visibilityStatusText">Turn on to appear in "who's nearby"</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="visibilityToggle" disabled>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <input type="text" id="currentCityInput" class="form-input" placeholder="Your current city (e.g. Mumbai)" style="width: 100%; margin-top: 10px;" disabled>
                <button type="button" id="saveCityBtn" class="save-city-btn" disabled>Save Location</button>
                <p class="visibility-status" id="citySaveMsg"></p>
            </div>

            <p class="section-label">Daily Trip Planner & Reminders</p>
            <div class="settings-group" style="padding: 12px; background: #f0f7fc; border: 1px solid #91AEC4; display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; gap: 6px;">
                    <input type="date" id="settingsCalendarDate" class="form-input" style="flex: 1;">
                    <input type="text" id="settingsTargetPlace" class="form-input" placeholder="Where to? (e.g. Cafe)" style="flex: 1.2;">
                </div>
                <textarea id="settingsDayNotes" class="form-input" rows="2" placeholder="Write reminders for this specific day..." style="width: 100%;"></textarea>

                <button type="button" onclick="saveSettingsItineraryPlan()" style="width: 100%; padding: 8px; background: #194569; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">
                    📅 Lock Schedule Day
                </button>

                <div id="settingsReminderDisplayBox" style="margin-top: 4px; padding: 8px; background: #ffffff; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 11px; color: #333; text-align: left; display: none; position: relative;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <strong>🔔 Planner Status:</strong>
                            <div id="settingsReminderTextSpan" style="margin-top: 4px;"></div>
                        </div>
                        <button onclick="manuallyDeleteItinerary()" style="background: none; border: none; color: #e63946; font-size: 14px; cursor: pointer; padding: 0 4px;">🗑️</button>
                    </div>
                </div>
            </div>

            <button type="button" id="logoutBtn" class="logout-btn">Log Out Account 🚪</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR API KEY HERE",
            authDomain: "travel-app-9a965.firebaseapp.com",
            projectId: "travel-app-9a965",
            storageBucket: "travel-app-9a965.firebasestorage.app",
            messagingSenderId: "611523199957",
            appId: "1:611523199957:web:0b183bc5f1e8f67182335c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const visibilityToggle = document.getElementById('visibilityToggle');
        const currentCityInput = document.getElementById('currentCityInput');
        const saveCityBtn = document.getElementById('saveCityBtn');
        const citySaveMsg = document.getElementById('citySaveMsg');
        const visibilityStatusText = document.getElementById('visibilityStatusText');

        let currentUserRef = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Not logged in — send back to login instead of showing a broken settings page
                window.location.href = "login.html";
                return;
            }

            currentUserRef = doc(db, "users", user.uid);

            // Load their existing city/visibility, if set before
            const snap = await getDoc(currentUserRef);
            if (snap.exists()) {
                const data = snap.data();
                currentCityInput.value = data.currentCity || "";
                visibilityToggle.checked = !!data.visibleOnSolo;
                updateVisibilityText();
            }

            // Enable the controls now that we know who the user is
            visibilityToggle.disabled = false;
            currentCityInput.disabled = false;
            saveCityBtn.disabled = false;
        });

        function updateVisibilityText() {
            visibilityStatusText.textContent = visibilityToggle.checked
                ? "You're visible — other travelers in your city can find you"
                : "Turn on to appear in \"who's nearby\"";
        }

        visibilityToggle.addEventListener('change', async () => {
            updateVisibilityText();
            if (!currentUserRef) return;
            try {
                await updateDoc(currentUserRef, { visibleOnSolo: visibilityToggle.checked });
            } catch (e) {
                citySaveMsg.textContent = "Couldn't update visibility — try again.";
                citySaveMsg.style.color = "#e63946";
            }
        });

        saveCityBtn.addEventListener('click', async () => {
            const cityVal = currentCityInput.value.trim();
            if (!currentUserRef) return;

            saveCityBtn.disabled = true;
            saveCityBtn.textContent = "Saving...";

            try {
                await updateDoc(currentUserRef, { currentCity: cityVal });
                citySaveMsg.textContent = "Location saved!";
                citySaveMsg.style.color = "#2a9d8f";
            } catch (e) {
                citySaveMsg.textContent = "Something went wrong saving your location.";
                citySaveMsg.style.color = "#e63946";
            }

            saveCityBtn.disabled = false;
            saveCityBtn.textContent = "Save Location";
            setTimeout(() => { citySaveMsg.textContent = ""; }, 2500);
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            localStorage.removeItem('loggedInUser');
            localStorage.removeItem('loggedInUsername');
            window.location.replace("login.html");
        });
    </script>

    <script>
        // Trip planner logic — unchanged from before, still using localStorage
        // since itinerary/reminders weren't part of this scoped change.
        window.addEventListener('DOMContentLoaded', function() {
            runLiveCalendarReminderCheck();
        });

        function saveSettingsItineraryPlan() {
            var chosenDate = document.getElementById('settingsCalendarDate').value;
            var targetPlace = document.getElementById('settingsTargetPlace').value.trim();
            var planNotes = document.getElementById('settingsDayNotes').value.trim();

            if(chosenDate === "" || targetPlace === "") {
                alert("Please select a date and location!");
                return;
            }

            localStorage.setItem('userActiveTravelItineraryPlan', JSON.stringify({ date: chosenDate, place: targetPlace, notes: planNotes }));
            runLiveCalendarReminderCheck();

            document.getElementById('settingsTargetPlace').value = "";
            document.getElementById('settingsDayNotes').value = "";
        }

        function runLiveCalendarReminderCheck() {
            var rawPlan = localStorage.getItem('userActiveTravelItineraryPlan');
            if(!rawPlan) {
                document.getElementById('settingsReminderDisplayBox').style.display = "none";
                return;
            }

            var plan = JSON.parse(rawPlan);
            var today = new Date();
            var formattedToday = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

            var containerBox = document.getElementById('settingsReminderDisplayBox');
            var textSpan = document.getElementById('settingsReminderTextSpan');

            if (plan.date < formattedToday) {
                localStorage.removeItem('userActiveTravelItineraryPlan');
                containerBox.style.display = "none";
                return;
            }

            if(plan.date === formattedToday) {
                textSpan.innerHTML = `Heading to <strong>${plan.place}</strong> today!<br><span style="color:#666; font-size:10px;">"${plan.notes || 'No notes.'}"</span>`;
            } else {
                textSpan.innerHTML = `Trip logged for <strong>${plan.date}</strong> to <strong>${plan.place}</strong>.`;
            }
            containerBox.style.display = "block";
        }

        function manuallyDeleteItinerary() {
            localStorage.removeItem('userActiveTravelItineraryPlan');
            runLiveCalendarReminderCheck();
        }
    </script>
</body>
</html>
