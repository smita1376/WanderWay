<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel App - Welcome</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .phone-frame {
            width: 345px;
            height: 610px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            border: 8px solid #1e293b;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .hero-image-wrap {
            position: relative;
            width: 100%;
            height: 65%;
            overflow: hidden;
        }
        .hero-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .hero-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: linear-gradient(to bottom, rgba(255,255,255,0), #ffffff);
        }

        .brand-badge {
            position: absolute;
            top: 18px;
            left: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #194569;
        }

        .welcome-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0 26px 26px 26px;
            text-align: center;
            box-sizing: border-box;
        }

        .welcome-content h1 {
            color: #194569;
            font-size: 22px;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }
        .welcome-content p {
            color: #5F84A2;
            font-size: 13px;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }

        .get-started-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #194569;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            box-sizing: border-box;
            box-shadow: 0 6px 14px rgba(25,69,105,0.3);
        }

        .dot-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; }
        .dot.active { background: #194569; width: 18px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="hero-image-wrap">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Beach destination">
            <div class="brand-badge">🌏 Wanderly</div>
            <div class="hero-fade"></div>
        </div>

        <div class="welcome-content">
            <div>
                <h1>Let your journey take flight ✈️</h1>
                <p>Discover hidden gems, plan the perfect trip, and connect with fellow solo travelers — all across India.</p>
            </div>
            <div>
                <div class="dot-row">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <a href="login.html" class="get-started-btn">Let's Start →</a>
            </div>
        </div>
    </div>

</body>
</html>
